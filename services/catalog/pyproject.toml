[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartretail-catalog"
version = "0.1.0"
description = "SmartRetail catalog service (RFC 0004): products, variants, categories, media, audit trail"
requires-python = ">=3.12"
dependencies = [
    "smartretail-common",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic[email]>=2.10,<2.11",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<2.11",
    "python-slugify>=8,<9",
    "anyio>=4",
]

[tool.setuptools]
# Dependencies only; the app/ source is copied into the image directly.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
