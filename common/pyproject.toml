[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartretail-common"
version = "0.1.0"
description = "SmartRetail shared platform library (RFC 0001). Holds no vocabulary and no business rule (R8)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "pyjwt[crypto]>=2.10,<2.11",
    "httpx>=0.28,<0.29",
    # The outbox writer validates payloads against the Avro schemas (PLT-4).
    "fastavro>=1.9,<2",
]

[project.optional-dependencies]
# smartretail_common.temporal: services that own or start a workflow.
temporal = ["temporalio>=1.9,<1.10"]
# smartretail_common.events producer/consumer/relay: the Kafka client (librdkafka).
events = ["confluent-kafka>=2.5,<2.7"]
# smartretail_common.celery_app: Celery over RabbitMQ.
celery = ["celery>=5.4,<5.5"]
# smartretail_common.redis: rate limits, pub/sub fan-out, tickets.
redis = ["redis[hiredis]>=5.2,<6"]

[tool.setuptools.packages.find]
include = ["smartretail_common*"]

# The event catalogue and its Avro schemas are data shipped with the package.
[tool.setuptools.package-data]
smartretail_common = ["py.typed", "events/catalogue.json", "events/schemas/*.avsc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Coverage gate (RFC 0001, review 2026-10-06 §5): `make cov`; CI fails below 85%.
[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["smartretail_common"]
# Test support code; every service's integration suite exercises it.
omit = ["smartretail_common/testing.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "htmlcov"
